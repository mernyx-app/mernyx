name: Bug report
description: Something in Mernyx is broken or does not match the source.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include the diagram source when the problem is about rendering, parsing or editing.
  - type: input
    id: version
    attributes:
      label: Mernyx version
      description: Found in Mernyx › About Mernyx.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 14.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Diagram source
      description: Paste the .mmd source if the issue involves rendering, parsing or editing.
      render: mermaid
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag files here if they help.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I removed API keys, licence keys and other secrets from this report.
          required: true
